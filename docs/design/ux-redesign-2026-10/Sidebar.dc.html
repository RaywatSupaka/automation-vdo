<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เมนูข้าง</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="เมนูหลัก" style="width:248px;min-height:860px;height:100%;box-sizing:border-box;background:#0E131E;border-right:1px solid #1E2740;display:flex;flex-direction:column;gap:6px;padding:20px 14px;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;color:#E8ECF4">
<div style="display:flex;align-items:center;gap:10px;padding:4px 8px 18px">
<div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#38BDF8,#A78BFA);display:flex;align-items:center;justify-content:center;font-weight:700;color:#0B0F17;font-size:18px">S</div>
<div style="display:flex;flex-direction:column">
<span style="font-size:16px;font-weight:700">SmartFlow AI</span>
<span style="font-size:13px;color:#8A94AA">{{modeLabel}}</span>
</div>
</div>
<sc-for list="{{items}}" as="item" hint-placeholder-count="7">
<a href="{{item.href}}" style="{{item.style}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg>
<span style="flex:1">{{item.label}}</span>
<sc-if value="{{item.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="{{item.badgeStyle}}">{{item.badge}}</span></sc-if>
</a>
</sc-for>
<div style="flex:1"></div>
<a href="Setup.dc.html" style="display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:#121826;border:1px solid #1E2740;text-decoration:none;color:#E8ECF4">
<span style="width:10px;height:10px;border-radius:50%;background:#34D399"></span>
<span style="display:flex;flex-direction:column;flex:1"><span style="font-size:14px;font-weight:600">เชื่อมต่อ Chrome แล้ว</span><span style="font-size:13px;color:#8A94AA">พร้อมทำงาน</span></span>
</a>
<a href="Main.dc.html" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;text-decoration:none;color:#A7B0C3;font-size:14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7M12 17h.01"></path></svg>
ช่วยเหลือและบันทึกระบบ
</a>
<sc-if value="{{isDev}}" hint-placeholder-val="{{ true }}">
<a href="Main.dc.html" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;text-decoration:none;color:#C4B5FD;font-size:14px;border:1px dashed #3B3366">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 9l-3 3 3 3M16 9l3 3-3 3M13 6l-2 12"></path></svg>
เครื่องมือนักพัฒนา
</a>
</sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","create","jobs","library","publish","cast","settings"],"default":"home"},"isDev":{"editor":"boolean","default":true},"$preview":{"width":248,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'home';
const isDev = this.props.isDev ?? true;
const base = 'display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;text-decoration:none;font-size:15px;font-weight:500;';
const list = [
{ id: 'home', label: 'หน้าแรก', href: 'Home.dc.html', icon: 'M3 11l9-7 9 7M5 10v10h14V10' },
{ id: 'create', label: 'สร้างงานใหม่', href: 'Create.dc.html', icon: 'M12 5v14M5 12h14' },
{ id: 'jobs', label: 'งานของฉัน', href: 'Jobs.dc.html', icon: 'M4 6h16M4 12h16M4 18h10', badge: '1 รอคุณ', warn: true },
{ id: 'library', label: 'คลังวิดีโอ', href: 'Home.dc.html', icon: 'M4 5h16v14H4zM10 9l5 3-5 3z', badge: '19' },
{ id: 'publish', label: 'เผยแพร่', href: 'Home.dc.html', icon: 'M12 16V4M7 9l5-5 5 5M5 20h14' },
{ id: 'cast', label: 'ตัวละคร', href: 'Home.dc.html', icon: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0' },
{ id: 'settings', label: 'ตั้งค่า', href: 'Settings.dc.html', icon: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12h2M3 12h2M12 3v2M12 19v2M17 7l1.4-1.4M5.6 18.4L7 17M17 17l1.4 1.4M5.6 5.6L7 7' }
];
const items = list.map((it) => {
const on = it.id === active;
return {
...it,
hasBadge: !!it.badge,
style: base + (on ? 'background:#16263A;color:#E8ECF4;box-shadow:inset 3px 0 0 #38BDF8;' : 'color:#A7B0C3;'),
badgeStyle: 'font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;' + (it.warn ? 'background:#3A2E0B;color:#FCD34D;' : 'background:#1A2236;color:#A7B0C3;')
};
});
return { items, isDev, modeLabel: isDev ? 'โหมดนักพัฒนา' : 'รุ่น 0.15.519' };
}
}
</script>
</body>
</html>
